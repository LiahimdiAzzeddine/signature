<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature Email - Marion Van Lissum</title>
    <style>
        @font-face {
            font-family: 'Archivo';
            src: url('https://tico.foodhea.com/signature/fonts/Archivo-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Archivo';
            src: url('https://tico.foodhea.com/signature/fonts/Archivo-Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }
        @font-face {
            font-family: 'Archivo';
            src: url('https://tico.foodhea.com/signature/fonts/Archivo-Italic.otf') format('opentype');
            font-weight: normal;
            font-style: italic;
        }
        @font-face {
            font-family: 'Archivo';
            src: url('https://tico.foodhea.com/signature/fonts/Archivo-Light.otf') format('opentype');
            font-weight: 300;
            font-style: normal;
        }
        
        body {
            font-family: 'Archivo', Arial, sans-serif;
            margin: 20px;
        }
        .signature-container {
            width: 600px;
        }
        .header {
            display: table;
            margin-bottom: 6px;
        }
        .contact-info {
            display: table-cell;
            vertical-align: top;
            width: 184px;
        }
        .contact-info h1 {
            color: #1e5a8e;
            font-size: 20px;
            margin: 0;
                line-height: 23px;
            font-weight: bold;
        }
        .contact-info h2 {
            color: #1e5a8e;
            font-style: italic;
            font-size: 13.2px;
            font-weight: normal;
                line-height: 14px;
            margin: 0;
        }
        .contact-item {
            display: table;
            margin: 6px 0;
        }
        .contact-item img {
            display: table-cell;
            height: 18px;
            vertical-align: middle;
            padding-right: 6px;
        }
        .contact-item span,
        .contact-item a {
            display: table-cell;
            vertical-align: middle;
            color: #1e5a8e;
            text-decoration: none;
            font-size: 10.8px;
        }
        .contact-item a {
            text-decoration: underline;
        }
        .logo {
            display: table-cell;
            vertical-align: top;
            text-align: right;
        }
        .logo img {
            width: 210px;
            height: auto;
            margin-left: 6px;
        }
        .content {
            display: table;
        }
        .icon-circle {
            display: table-cell;
            vertical-align: middle;
            width: 120px;
        }
        .icon-circle img {
            width: 100%;
            height: auto;
        }
        .message {
            display: table-cell;
            vertical-align: middle;
            padding-left: 5px;
        }
        .quote {
            color: #1e5a8e;
            font-style: italic;
            font-size: 11px;
            line-height: 1.3;
            margin-bottom: 9px;
                text-align: center;
        }
        .cta {
            text-align: center;
        }
        .cta-title {
            color: #ff8c00;
            font-size: 10.8px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .cta-link {
            color: #1e5a8e;
            font-size: 10.8px;
            font-weight: bold;
            text-decoration: underline;
        }
        .cta-link:hover {
            color: #ff8c00;
        }
    </style>
</head>
<body>
    <div class="signature-container" id="signature">
        <div class="header">
            <div class="contact-info">
                <h1>Marion Van Lissum</h1>
                <h2>Fondatrice</h2>
                
                <div class="contact-item">
                    <img src="https://tico.foodhea.com/signature/phone.jpg" alt="Téléphone">
                    <span>06.89.82.43.53</span>
                </div>
                
                <div class="contact-item">
                    <img src="https://tico.foodhea.com/signature/lettre.jpg" alt="Email">
                    <a href="mailto:m.vanlissum@tico-scan.org">m.vanlissum@tico-scan.org</a>
                </div>
            </div>
            
            <div class="logo">
                <img src="https://tico.foodhea.com/signature/TicoText.jpg" alt="TICO - Association d'intérêt général">
            </div>
        </div>
        
        <div class="content">
            <div class="icon-circle">
                <img src="https://tico.foodhea.com/signature/cadi.jpg" alt="Icône caddie">
            </div>
            
            <div class="message">
                <p class="quote">
                    "Un enfant qui sait lire une étiquette, c'est un adulte qui ne<br>
                    subira pas mais qui choisira son alimentation en pleine<br>
                    conscience, pour sa santé et celles de ses proches."
                </p>
                
                <div class="cta">
                    <div class="cta-title">Soutenez la pédagogie de<br>l'alimentation</div>
                    <a href="https://www.helloasso.com/associations/tico-transparence-information-consommateur/formulaires/1" class="cta-link">Faire un don</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
